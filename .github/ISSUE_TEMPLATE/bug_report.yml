name: "Bug Report"
description: "Report incorrect, outdated, or unsafe skill behavior, references, assets, utilities, or evaluations"
title: "[Bug] "
labels:
  - "bug"
body:
  - type: dropdown
    id: component
    attributes:
      label: "Which component has the issue?"
      options:
        - "SKILL.md"
        - "Reference"
        - "Asset or schema"
        - "Utility"
        - "Evaluation or test harness"
        - "Integration profile"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: specific_file
    attributes:
      label: "Which specific file?"
      placeholder: "e.g. references/contracts-quality-and-testing.md"
    validations:
      required: false

  - type: textarea
    id: current_behavior
    attributes:
      label: "What is the current behavior or content?"
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "What is the expected behavior or content?"
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to reproduce (if skill behavior issue)"
      placeholder: "1. Trigger the skill with prompt... 2. Observe..."
    validations:
      required: false

  - type: checkboxes
    id: before_submitting
    attributes:
      label: "Before submitting"
      options:
        - label: "I searched existing issues"
        - label: "I verified this is still present in the latest version"
