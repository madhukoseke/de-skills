name: Validate Skill

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 scripts/build_bundles.py
      - run: tests/run_e2e_harness.sh
      - run: python3 tests/validate_release_package.py
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py skills/data-engineering/scripts/*.py tests/*.py tests/benchmark/*.py tests/benchmark/live/*.py tests/benchmark/live/providers/*.py examples/*.py examples/airflow/*.py
      - name: No tracked caches
        run: '! git ls-files | grep -q __pycache__'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes markdownlint-cli2@0.17.2 "*.md" "docs/**/*.md" "integrations/*.md" "skills/data-engineering/**/*.md" ".github/**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-path .git --exclude-path tests/benchmark/legacy_v5 --max-concurrency 8 --timeout 120 --max-retries 5 --accept 100..=103,200..=399,429 .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
