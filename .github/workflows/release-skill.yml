name: Release Skill Bundle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 scripts/build_bundles.py
      - run: tests/run_e2e_harness.sh
      - name: Require published benchmark evidence
        run: python3 tests/benchmark/validate_published_report.py
      - run: python3 tests/validate_release_package.py
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-engineering-${{ github.ref_name }}
          path: release-artifacts/
