name: Release Skill Bundle

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version label for the packaged bundle
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install validator dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/requirements.txt

      - name: Validate SKILL.md frontmatter
        run: |
          SKILL_FILE="skills/data-engineering-best-practices/SKILL.md"
          if ! grep -q "^name:" "$SKILL_FILE"; then
            echo "::error::SKILL.md missing required 'name' in frontmatter"
            exit 1
          fi
          if ! grep -q "^description:" "$SKILL_FILE"; then
            echo "::error::SKILL.md missing required 'description' in frontmatter"
            exit 1
          fi
          echo "Frontmatter validation passed"

      - name: Validate playbook files exist
        run: |
          SKILL_FILE="skills/data-engineering-best-practices/SKILL.md"
          playbooks=$(grep -oE '\(playbooks/[^)]+\)' "$SKILL_FILE" | tr -d '()' | sort -u)
          if [ -z "$playbooks" ]; then
            echo "::error::No playbook paths found in SKILL.md"
            exit 1
          fi
          while IFS= read -r f; do
            if [ ! -f "skills/data-engineering-best-practices/$f" ]; then
              echo "::error::Missing playbook referenced by SKILL.md: $f"
              exit 1
            fi
          done <<< "$playbooks"
          echo "Playbook files validation passed"

      - name: Validate template files exist
        run: |
          SKILL_FILE="skills/data-engineering-best-practices/SKILL.md"
          templates=$(grep -oE '\(templates/[^)]+\)' "$SKILL_FILE" | tr -d '()' | sort -u)
          if [ -z "$templates" ]; then
            echo "::error::No template paths found in SKILL.md"
            exit 1
          fi
          while IFS= read -r f; do
            if [ ! -f "skills/data-engineering-best-practices/$f" ]; then
              echo "::error::Missing template referenced by SKILL.md: $f"
              exit 1
            fi
          done <<< "$templates"
          echo "Template files validation passed"

      - name: Validate canonical skill is vendor-neutral
        run: |
          python3 tests/validate_vendor_neutrality.py

      - name: Build and validate adapter artifacts
        run: |
          python3 scripts/build_adapters.py
          python3 scripts/build_adapters.py --check
          python3 tests/validate_adapters.py
          python3 tests/validate_provider_fixtures.py
          python3 tests/validate_json_responses.py
          python3 tests/validate_release_package.py

      - name: Validate Python script syntax
        run: |
          python3 -m py_compile examples/*.py tests/benchmark/live/providers/*.py tests/benchmark/live/run_live_benchmark.py scripts/*.py tests/*.py tests/benchmark/*.py

      - name: Validate E2E harness
        run: |
          tests/run_e2e_harness.sh

      - name: Benchmark quality gate (skill vs baseline)
        run: |
          tests/benchmark/run_skill_vs_no_skill.sh

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release artifact
        run: |
          python3 scripts/package_release.py --version "${{ steps.version.outputs.value }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: data-engineering-best-practices-${{ steps.version.outputs.value }}
          path: release-artifacts/
        # Note: upload-artifact does not require contents:write at the workflow level —
        # it uses the runner's GITHUB_TOKEN scoped to actions:write only.
