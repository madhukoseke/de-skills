# Data Contract Template
# Fill in all fields. Delete comments before committing.
# Referenced by: DESIGN, WAREHOUSE, PR_REVIEW modes

schema_version: "1.0"

# === Contract Metadata ===
contract:
  name: ""                          # e.g., "orders_events_v2"
  description: ""                   # Human-readable purpose of this dataset
  owner:
    team: ""                        # Owning team name
    slack_channel: ""               # e.g., "#data-eng-alerts"
    oncall_rotation: ""             # e.g., "de-oncall@yourcompany.com"
  version: "1.0.0"                  # Semantic versioning: MAJOR.MINOR.PATCH
  status: "draft"                   # draft | active | deprecated | retired
  created_date: ""                  # YYYY-MM-DD
  last_updated: ""                  # YYYY-MM-DD

# === Source ===
source:
  system: ""                        # e.g., "salesforce", "postgres_orders_db", "kafka"
  type: ""                          # api | database | file | event_stream
  connection: ""                    # Connection identifier (not credentials)
  extraction_method: ""             # full_refresh | incremental | cdc | streaming
  refresh_frequency: ""             # e.g., "daily 06:00 UTC", "every 5 minutes", "real-time"

# === Destination ===
destination:
  warehouse: ""                     # Warehouse or database name
  schema: ""                        # Schema or dataset name
  table: ""                         # Table name
  layer: ""                         # raw | staging | curated | mart
  format: ""                        # native_table | parquet | avro | json | delta

# === Schema Definition ===
schema:
  fields:
    - name: ""                      # Column name (snake_case)
      type: ""                      # VARCHAR | INTEGER | BIGINT | FLOAT | BOOLEAN | TIMESTAMP | DATE | STRUCT | ARRAY
      mode: "NULLABLE"              # NULLABLE | REQUIRED | REPEATED
      description: ""               # Human-readable description
      pii: false                    # true if column contains PII (triggers masking/encryption rules)
      pii_category: "none"          # email | phone | name | address | ssn | financial | health | none
      business_key: false           # true if this is a natural/business key
      example: ""                   # Example value for documentation

    # Copy the block above for each field. Example:
    # - name: "customer_id"
    #   type: "VARCHAR"
    #   mode: "REQUIRED"
    #   description: "Unique customer identifier from source system"
    #   pii: false
    #   pii_category: "none"
    #   business_key: true
    #   example: "CUST-123456"

  primary_key: []                   # List of columns forming the primary/business key
  partition_column: ""              # Column used for table partitioning (if applicable)
  partition_type: ""                # DAY | HOUR | MONTH | YEAR | INTEGER_RANGE (warehouse-dependent)
  sort_keys: []                     # Sort/cluster columns for query performance (warehouse-dependent)
  indexes: []                       # Additional index columns (for OLTP-style warehouses)

# === Quality Rules ===
quality:
  freshness:
    max_delay: ""                   # e.g., "2 hours", "30 minutes"
    check_column: ""                # Column to check for freshness (e.g., "loaded_at")
  completeness:
    required_columns: []            # Columns that must never be NULL
    min_row_count: 0                # Minimum expected rows per load (0 = no check)
  uniqueness:
    unique_keys: []                 # Column combinations that must be unique
  custom_rules:
    - name: ""                      # Rule name
      sql: ""                       # SQL expression that must return 0 rows to pass
      severity: "error"             # error | warning
      description: ""               # What this rule checks

# === SLA ===
sla:
  availability: ""                  # e.g., "99.9%"
  freshness_sla: ""                 # e.g., "Data available by 08:00 UTC daily"
  support_hours: ""                 # e.g., "24/7" or "business hours US-Pacific"
  incident_response: ""             # e.g., "P1: 15min, P2: 1hr, P3: 4hr"

# === Change Management ===
change_management:
  breaking_change_notice_days: 30   # Days of notice required before breaking changes
  breaking_changes:                 # What constitutes a breaking change:
    - "Removing or renaming a field"
    - "Changing a field type"
    - "Changing partition or sort key columns"
    - "Changing primary key columns"
    - "Reducing data retention"
  change_log:
    - version: "1.0.0"
      date: ""                      # YYYY-MM-DD
      author: ""
      description: "Initial contract"
      breaking: false

# === Access & Security ===
access:
  classification: ""                # public | internal | confidential | restricted
  authorized_readers: []            # Groups or roles with read access
  authorized_writers: []            # Groups or roles with write access
  row_level_security: false         # Whether row-level access control is applied
  column_level_security: false      # Whether column-level masking is applied
  pii_handling: ""                  # masked | encrypted | tokenized | none

# === Retention === (Playbook 14 §2 — required when classification == restricted or any pii: true)
retention:
  period_days: 0                    # Default retention for the dataset (set explicitly; 0 means undefined)
  hard_delete_after: 0              # Maximum allowed retention before hard delete; 0 means undefined
  legal_hold: false                 # Set true only on legal counsel request; blocks deletion
  basis: ""                         # Legal/business basis (e.g., "contractual; analytics; reviewed annually")
  deletion_method: ""               # overwrite + vacuum | soft tombstone | crypto_erasure

# === Governance === (Playbook 14 §2)
governance:
  classification: ""                # mirror of access.classification; restricted | confidential | internal | public
  masking_policy: ""                # Named policy in your masking layer (e.g., "tokenize_email_v2"); empty if not applicable
  encryption_at_rest: ""            # e.g., "aes-256-gcm" | "aes-256-gcm-cmek" (CMEK / customer-managed key)
  encryption_in_transit: ""         # e.g., "tls-1.2-min"
  audit_log_dataset: ""             # Where reads of this dataset are logged (e.g., "audit.data_access_log")
  data_residency: ""                # ISO 3166 country/region code (e.g., "EU", "US", "JP")
  cross_border_transfer: "none"     # none | adequacy_decision | scc | bcr | consent_based
  consent_keyed: false              # Whether rows carry an explicit consent legal-basis column
  consent_column: ""                # Column holding the legal basis (if consent_keyed)

# === Subject Rights === (Playbook 14 §6 — required for any dataset linkable to a subject)
subject_rights:
  right_to_erasure: false           # GDPR Art. 17 / CCPA §1798.105
  right_to_access: false            # GDPR Art. 15 / CCPA §1798.110
  right_to_portability: false       # GDPR Art. 20
  identifiable_by: []               # Columns that link rows to a subject (e.g., [customer_id, customer_email])
  erasure_strategy: ""              # tombstone_and_purge | crypto_erasure | full_rewrite | not_applicable
  erasure_sla_hours: 0              # Time from request to completion (regulatory typical: <= 720 hours / 30 days)

# === Downstream Dependencies ===
consumers:
  - name: ""                        # Consumer name
    team: ""                        # Consumer team
    usage: ""                       # How they use this data
    sla_dependency: false           # Whether they depend on this data's SLA
